name: Create Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: '版本递增类型'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "mingzaily"
          git config user.email "mingzaily@163.com"

      - name: Calculate next version
        id: version
        run: |
          # 获取最新标签
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"

          # 解析版本号
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          # 根据类型递增
          case "${{ inputs.bump_type }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "previous_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Prepare release summary
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          REPO: ${{ github.repository }}
        run: |
          SUMMARY_FILE="$RUNNER_TEMP/release-summary.md"
          {
            echo "## 变更摘要"
            if [ "$PREVIOUS_TAG" = "v0.0.0" ]; then
              git log --no-merges --format='- %s'
            else
              git log --no-merges --format='- %s' "${PREVIOUS_TAG}..HEAD"
            fi
            echo
            echo "---"
            echo "### 🐳 Docker 镜像"
            echo
            echo '```bash'
            echo "docker pull ghcr.io/${REPO}:${VERSION}"
            echo '```'
            echo
            echo "或使用 latest 标签："
            echo '```bash'
            echo "docker pull ghcr.io/${REPO}:latest"
            echo '```'
          } > "$SUMMARY_FILE"
          echo "summary_file=$SUMMARY_FILE" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: ${{ steps.notes.outputs.summary_file }}
        run: |
          notes="$(<"$NOTES_FILE")"
          if [ "${{ steps.version.outputs.previous_tag }}" = "v0.0.0" ]; then
            # 首次发布，不指定 previous tag
            gh release create "v${{ steps.version.outputs.version }}" \
              --title "v${{ steps.version.outputs.version }}" \
              --notes "$notes" \
              --generate-notes
          else
            gh release create "v${{ steps.version.outputs.version }}" \
              --title "v${{ steps.version.outputs.version }}" \
              --notes "$notes" \
              --generate-notes \
              --notes-start-tag "${{ steps.version.outputs.previous_tag }}"
          fi
