name: Build and Push Docker Image

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: '版本标签 (如 v0.1.0)，留空则使用最新 tag'
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 手动创建 Release 时，始终从 Release 对应的 tag 构建。
          # 手动触发 workflow 时，使用页面选择的 ref。
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Get version tag
        id: get_tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            # 获取最新 tag
            git fetch --tags
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          fi

          if [ -z "$TAG" ]; then
            echo "No tag found"
            exit 1
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          # 去掉 v 前缀用于 Docker tag
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using tag: $TAG, version: $VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get_tag.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
